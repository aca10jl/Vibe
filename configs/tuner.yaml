# D2DB-Tuner Agent 自身配置（只读禁区）
llm:
  mode: auto                 # api: 强制走本地大模型 | offline: 确定性规则版 |
                             # auto: 设了 OPENAI_BASE_URL 或 OPENAI_API_KEY 环境变量则走 api
  api:                       # OpenAI 兼容接口（vLLM / Ollama / LMDeploy / SGLang 等本地部署均可）
    base_url: http://127.0.0.1:8000/v1   # 环境变量 OPENAI_BASE_URL 优先于此处
    api_key: EMPTY                       # 本地部署通常随意填；环境变量 OPENAI_API_KEY 优先
    chat_model: Qwen2.5-32B-Instruct     # PROPOSE 节点用的语言模型
    vision_model: Qwen2.5-VL-32B-Instruct  # DIAGNOSE 节点用的多模态模型（看证据包图片）
    temperature: 0.2
    max_tokens: 4096
    timeout_s: 180
    use_json_mode: true      # 请求 response_format=json_object；服务端不支持时自动降级重试
    send_images: true        # 多模态模型不可用时可置 false，DIAGNOSE 退化为纯文本证据
  max_evidence_cases_per_bucket: 3   # DIAGNOSE 每桶最多看几个证据包

regression_gate:
  dataset: dev
  rules:
    overall_recall_drop_max: 0.002        # 总 recall 几乎不许降
    per_type_recall_drop_max: 0.005       # 任一类型 recall 容差 0.5%
    nuisance_rate_rise_max: 0.005
    epe_p95_ratio_max: 1.10
  on_fail: rollback

budget:
  max_iterations_per_session: 20
  max_wall_hours: 8.0
  max_l1_changes_per_proposal: 3

convergence:
  hypothesis_cooldown_after_failures: 2   # 同一假设连续失败 2 次则冷却该桶

golden_policy:
  run_only_at: milestone
  feed_back_to_agent: false
